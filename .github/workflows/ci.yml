name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  data-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: scripts/check_no_data.sh --history

  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Ruff lint (select = ALL)
        run: uv run ruff check src tests --output-format=github
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Pyright (strict)
        run: uv run pyright
      - name: Unused or missing dependencies (deptry)
        run: uv run deptry src
      - name: Dead code (vulture, high-confidence only)
        run: uvx --python 3.14 vulture@2.16 src tests --min-confidence 80
      - name: Dependency vulnerabilities (pip-audit)
        run: |
          uv export --no-hashes --all-extras --no-emit-project -q -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 -r "$RUNNER_TEMP/requirements.txt" --disable-pip --no-deps
      - name: Tests + coverage (synthetic fixtures only; real-data tests are skipped)
        run: uv run pytest
      - uses: actions/upload-artifact@v4
        with: { name: engine-coverage, path: engine/coverage.xml }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Biome (lint + format)
        run: pnpm lint
      - name: TypeScript (strict)
        run: pnpm typecheck
      - name: Unused files, exports and dependencies (knip)
        run: pnpm dlx knip@5.88.1 --no-progress
      - name: Dependency vulnerabilities
        run: pnpm audit --prod
      - name: Tests + coverage
        run: pnpm coverage
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
