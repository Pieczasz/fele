[project]
name = "fele"
version = "0.1.0"
description = "fele engine: GRID ingestion, statistics, ML draft models and API"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "polars>=1.30",
    "duckdb>=1.3",
    "pyarrow>=20",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    "httpx>=0.28",
    "scikit-learn>=1.7",
    "lightgbm>=4.6",
    "scipy>=1.15",
    "numpy>=2.2",
    "pyyaml>=6.0",
    "typer>=0.16",
]

[project.optional-dependencies]
ml = [
    "arviz>=1.3.0",
    "mapie>=1.6.0",
    "mlflow>=3.1",
    "optuna>=4.3",
    "optuna-integration>=5.1.0",
    "pymc>=6.4.0",
    "shap>=0.48",
    "statsmodels>=0.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "ruff>=0.12",
    "pyright>=1.1.400",
    "respx>=0.22",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.170.15",
    "pandera[polars]>=0.36.0",
    "deptry>=0.25.1",
    "pip-audit>=2.10.1",
    "scipy-stubs>=1.18.1.1",
]
notebook = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
    "matplotlib>=3.11.2",
    "nbstripout>=0.9.2",
]

[project.scripts]
fele = "fele.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fele"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
allowed-confusables = ["×", "–"]  # math and ranges in docstrings
select = ["ALL"]
ignore = [
    "D",        # docstrings: required only where they add value
    "COM812",   # conflicts with the formatter
    "CPY",      # no per-file copyright headers (MIT LICENSE at root)
    "TD", "FIX",  # TODO notes are allowed
    "TRY003", "EM",  # descriptive exception messages inline are fine
    "TC",       # Python 3.14 annotations are lazy; TYPE_CHECKING blocks add noise, not safety
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "INP001", "ANN"]
"src/fele/db.py" = ["S608"]  # DDL over our own config paths (quoted), no user input
"src/fele/cli.py" = ["PLC0415", "FBT001", "FBT002"]  # lazy imports keep the CLI fast; typer flags are bools

[tool.ruff.lint.pylint]
max-args = 6

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = ["real_data: needs the local GRID clone (skipped in CI)", "riot: hits the live Riot API (skipped by default)"]
addopts = "-m 'not real_data and not riot' --cov=fele --cov-report=term-missing:skip-covered --cov-report=xml"

[tool.pyright]
include = ["src"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.coverage.run]
branch = true
source = ["src/fele"]

[tool.coverage.report]
fail_under = 50   # raise as phases land
skip_empty = true
