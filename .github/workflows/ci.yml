name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  data-leak-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: scripts/check_no_data.sh --history

  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Ruff lint (select = ALL)
        run: uv run ruff check src tests --output-format=github
      - name: Ruff format
        run: uv run ruff format --check src tests
      - name: Pyright (strict)
        run: uv run pyright
      - name: Tests + coverage (synthetic fixtures only; real-data tests are skipped)
        run: uv run pytest
      - uses: actions/upload-artifact@v4
        with: { name: engine-coverage, path: engine/coverage.xml }

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - name: Biome (lint + format)
        run: pnpm lint
      - name: TypeScript (strict)
        run: pnpm typecheck
      - name: Tests + coverage
        run: pnpm coverage
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
